<div class="pf-group">
  <button
    type="button"
    class="pf-btn"
    [class.open]="open()"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="'mc.project_filter.aria' | t: { name: active()?.label ?? ('projects.filter.label' | t) }"
    [attr.title]="'projects.filter.label' | t"
    (click)="toggle()"
  >
    @if (active(); as choice) {
      <span class="pf-dot" [style.background]="choice.color" aria-hidden="true"></span>
      <span class="pf-label">{{ choice.label }}</span>
    }
    <mc-ph-icon name="chev-down" [size]="face() === 'pad' ? 18 : 16" />
  </button>
  @if (open()) {
    <div class="pf-backdrop" (click)="close()"></div>
    <div class="pf-menu" role="menu" [attr.aria-label]="'projects.filter.label' | t">
      @for (choice of choices(); track choice.id) {
        <button
          type="button"
          role="menuitemradio"
          class="pf-item"
          [attr.data-project]="choice.id"
          [attr.aria-checked]="value() === choice.id"
          (click)="choose(choice.id)"
        >
          <span class="pf-check" aria-hidden="true">
            @if (value() === choice.id) {
              <mc-ph-icon name="check" [size]="16" />
            }
          </span>
          <span class="pf-dot pf-dot-10" [style.background]="choice.color" aria-hidden="true"></span>
          <span class="pf-name">{{ choice.label }}</span>
        </button>
      }
    </div>
  }
</div>
