<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('restart') {
      <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
      <path d="M21 3v5h-5" />
    }
    @case ('stop') {
      <rect x="6" y="6" width="12" height="12" rx="1.5" />
    }
    @case ('start') {
      <path d="M8 5.5v13l10-6.5z" />
    }
    @case ('release') {
      <path d="M12 5l7 8H5z" />
      <path d="M5 18h14" />
    }
    @case ('minimize') {
      <path d="M5 12h14" />
    }
    @case ('maximize') {
      <rect x="5" y="5" width="14" height="14" rx="1" />
    }
    @case ('close') {
      <path d="M6 6l12 12M18 6L6 18" />
    }
    @case ('plus') {
      <path d="M12 5v14M5 12h14" />
    }
    @case ('chevron-down') {
      <path d="M6 9l6 6 6-6" />
    }
  }
</svg>
