<div role="tablist" class="seg" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <button type="button" role="tab" class="sw-pill" [attr.aria-selected]="option.value === value()" (click)="picked.emit(option.value)">
      {{ option.label }}
    </button>
  }
</div>
