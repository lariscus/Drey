<span class="mark" aria-hidden="true">D</span>
<span class="name">{{ 'service_window.title' | t }}</span>
<span class="grow"></span>
<button type="button" class="wc" [attr.aria-label]="'service_window.window.minimize' | t" (click)="control('minimize')">
  <sw-icon name="minimize" [size]="14" />
</button>
<button type="button" class="wc" [attr.aria-label]="'service_window.window.maximize' | t" (click)="control('maximize')">
  <sw-icon name="maximize" [size]="13" />
</button>
<button type="button" class="wc" [attr.aria-label]="'service_window.window.close' | t" (click)="control('close')">
  <sw-icon name="close" [size]="14" />
</button>
